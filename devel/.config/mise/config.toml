[settings]
experimental = true
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = true, truncate = false }
idiomatic_version_file_enable_tools = []
python.github_attestations = false

[settings.pipx]
uvx = true

[tools]
aws = "2.33.15"
azure-cli = "latest"
bats = "latest"
bun = "latest"
cilium-cli = "0.19.0"
clusterctl = "1.13.2"  # prev: 1.10.7, 1.12.7
crossplane = "latest"
gcloud = "467.0.0"
go = "1.26"
golangci-lint = "2.11.3"
gomplate = "latest"
helm = "4.1.3"  # next: 4.1.3 prev: 3.18.4
#helm = "3.18.4"  # next: 4.1.3 prev: 3.18.4
helmfile = "1.5.5"
#helmfile = "1.4.2"  # next: 1.4.2 prev 0.171.0
kind = "latest"
krew = "latest"
kubebuilder = "latest"
kubecolor = "0.5.3"
kubeconform = "v0.6.7"
kubectl = "1.35.4"
kubelogin = "latest"
pipx = "latest"
#python = "3.10.11"
ruby = "latest"
sops = "3.10.1"
tekton = "latest"
#terraform = "latest"
terraform = "1.3.9"
usage = "latest"
velero = "1.13.0"
yq = "4.45.1"

"go:github.com/neilpa/yajsv" = "v1.4.1"
#"go:github.com/ueokande/kubectl-evict" = "latest"
"go:github.com/ueokande/kubectl-evict" = "v0.0.0-20240803050331-46aa0fb4296b"

"pipx:cels" = "latest"
"pipx:s3cmd" = "2.4.0"
"pipx:python-openstackclient" = { version = "latest", uvx_args = "--with python-octaviaclient --with gnureadline" }
"pipx:pycln" = "latest"

[env]
GIT_TEST_VERIFY = "prek run -s HEAD~1 -o HEAD"
PYTHONWARNINGS = "ignore::SyntaxWarning,ignore::FutureWarning"
_.path = ["{{env.HOME}}/.krew/bin"]

[hooks.enter]
shell = "zsh"
script = "source <(cilium completion zsh)"
